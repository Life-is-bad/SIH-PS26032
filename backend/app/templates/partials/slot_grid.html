<div class="slot-grid">
    {% for slot in slots %}
    <form class="slot-card" method="post" action="/farmer/book/{{ slot.slot_id }}">
        <div class="slot-time">{{ slot.slot_date }} &middot; {{ slot.start_time }} - {{ slot.end_time }}</div>
        <div class="slot-seats">{{ slot.booked_count }} of {{ slot.capacity }} booked</div>
        <div class="slot-bar">
            <div style="width:{{ (slot.booked_count / slot.capacity * 100)|round }}%"></div>
        </div>
        <div class="field" style="margin-top:10px;">
            <input type="text" name="produce_type" placeholder="What are you bringing? (e.g. Wheat)">
        </div>
        <button type="submit" {% if slot.booked_count>= slot.capacity %}disabled{% endif %}>
            {% if slot.booked_count >= slot.capacity %}Full{% else %}Book slot{% endif %}
        </button>
    </form>
    {% else %}
    <p>No slots available right now.</p>
    {% endfor %}
</div>
