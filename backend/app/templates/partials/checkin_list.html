<table>
    <tr>
        <th>{{ t.col_farmer if t else "Farmer" }}</th>
        <th>{{ t.col_produce if t else "Produce" }}</th>
        <th>{{ t.col_slot if t else "Slot" }}</th>
        <th></th>
    </tr>
    {% for b in pending %}
    <tr>
        <td>{{ b.farmer_name }}</td>
        <td>{{ b.produce_type or "—" }}</td>
        <td class="mono">{{ b.start_time }}</td>
        <td>
            <button class="action-btn" hx-post="/officer/checkin/{{ b.booking_id }}" hx-target="#officer-panels"
                hx-swap="innerHTML">{{ t.check_in_btn if t else "Check in" }}</button>
        </td>
    </tr>
    {% else %}
    <tr>
        <td colspan="4">No pending bookings for today.</td>
    </tr>
    {% endfor %}
</table>
