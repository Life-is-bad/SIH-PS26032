<div id="slot-manage-list">
    {% if error %}
    <p class="error-text">{{ error }}</p>
    {% endif %}
    <table>
        <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Booked</th>
            <th></th>
        </tr>
        {% for s in slots %}
        <tr>
            <td>{{ s.slot_date }}</td>
            <td class="mono">{{ s.start_time }} - {{ s.end_time }}</td>
            <td>{{ s.booked_count }} / {{ s.capacity }}</td>
            <td>
                <button class="action-btn" hx-delete="/officer/slots/{{ s.slot_id }}?counter_id={{ counter_id }}"
                    hx-target="#slot-manage-list" hx-swap="outerHTML" hx-confirm="Delete this slot?">Delete</button>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">No upcoming slots for this counter.</td>
        </tr>
        {% endfor %}
    </table>
</div>
