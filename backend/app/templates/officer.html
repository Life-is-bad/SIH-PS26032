{% extends "base.html" %}
{% block title %}Officer console — Agri-Queue{% endblock %}
{% block content %}
<h1>Live queue — Counter {{ counter_id }}</h1>

<div class="section-title">Add a new slot</div>
<form method="post" action="/officer/slots/new"
    style="display:flex;gap:10px;align-items:end;margin-bottom:30px;flex-wrap:wrap;">
    <div class="field" style="margin:0;">
        <label>Counter</label>
        <select name="counter_id" required>
            {% for c in counters %}
            <option value="{{ c.counter_id }}">{{ c.counter_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field" style="margin:0;">
        <label>Date</label>
        <input type="date" name="slot_date" required>
    </div>
    <div class="field" style="margin:0;">
        <label>Start time</label>
        <input type="time" name="start_time" required>
    </div>
    <div class="field" style="margin:0;">
        <label>End time</label>
        <input type="time" name="end_time" required>
    </div>
    <div class="field" style="margin:0;">
        <label>Capacity</label>
        <input type="number" name="capacity" min="1" value="20" required>
    </div>
    <button class="btn btn-outline" type="submit" style="width:auto;padding:10px 18px;">Add slot</button>
</form>

<div class="section-title">Manage slots</div>
{% include "partials/slot_manage_list.html" %}

<div id="officer-panels">
    {% include "partials/officer_panels.html" %}
</div>

{% endblock %}
