{% extends "base.html" %}
{% block title %}Log in — Agri-Queue{% endblock %}
{% block content %}
<div class="auth-wrap">
    <h1>Log in</h1>
    <div class="sub">Book slots and track your queue at the mandi</div>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
        <div class="field">
            <label>Phone number</label>
            <input type="text" name="phone_number" required>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button class="btn" type="submit">Log in</button>
    </form>
    <div class="form-note">No account? <a href="/signup">Sign up</a></div>
</div>
{% endblock %}
